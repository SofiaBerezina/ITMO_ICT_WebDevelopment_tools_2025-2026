services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_manager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/time_manager_db
      PARSER_SERVICE_URL: http://parser:8001
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: lab3-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - db
      - parser
      - redis

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/time_manager_db
    ports:
      - "8001:8001"
    depends_on:
      - db

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/time_manager_db
      PARSER_SERVICE_URL: http://parser:8001
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: lab3-secret-key
    depends_on:
      - api
      - parser
      - redis

volumes:
  postgres_data:
